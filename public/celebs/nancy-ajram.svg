<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <defs>
    <linearGradient id="bg-nancy-ajram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="floor-nancy-ajram" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9d174d"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="namebar-nancy-ajram" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.82)"/>
    </linearGradient>
    <radialGradient id="spotlight-nancy-ajram" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Background gradient fills full frame – no clip -->
  <rect width="300" height="380" fill="url(#bg-nancy-ajram)"/>
  <rect width="300" height="380" fill="url(#spotlight-nancy-ajram)"/>

  <!-- Floor / lower darker band -->
  <rect x="0" y="273.59999999999997" width="300" height="106.4" fill="url(#floor-nancy-ajram)"/>

  <!-- Subtle decorative orbs -->
  <circle cx="30"  cy="30"  r="80"  fill="rgba(255,255,255,0.05)"/>
  <circle cx="280" cy="360" r="90" fill="rgba(0,0,0,0.07)"/>

  <!-- Clothes / shirt collar area -->
  <ellipse cx="150" cy="390" rx="90" ry="121.60000000000001" fill="#ec4899dd"/>
  <ellipse cx="150" cy="390" rx="73.8" ry="102.60000000000001" fill="#ec4899ff"/>

  <!-- Neck -->
  <rect x="128" y="219" width="44" height="40" rx="15.399999999999999" fill="#f0c8a0"/>

  <!-- ── Hair behind head ── -->
  
        <ellipse cx="150" cy="113" rx="50" ry="26" fill="#180e06"/>
        <rect x="98" y="128" width="18" height="120" rx="9" fill="#180e06"/>
        <rect x="186" y="128" width="18" height="120" rx="9" fill="#180e06"/>
        <ellipse cx="150" cy="213" rx="34" ry="20" fill="#180e06"/>
      

  <!-- ── Head ── -->
  <ellipse cx="150" cy="175" rx="44" ry="52" fill="#f0c8a0"/>

  <!-- Ears -->
  <ellipse cx="105" cy="178.12" rx="7" ry="9" fill="#f0c8a0"/>
  <ellipse cx="195" cy="178.12" rx="7" ry="9" fill="#f0c8a0"/>
  <ellipse cx="105" cy="178.12" rx="3.5" ry="5" fill="#f0c8a0" opacity="0.7"/>
  <ellipse cx="195" cy="178.12" rx="3.5" ry="5" fill="#f0c8a0" opacity="0.7"/>

  <!-- ── Eyebrows ── -->
  <path d="M 122 159.79999999999998 Q 134 152.79999999999998 144 157.79999999999998"
    stroke="#180e06" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  <path d="M 156 157.79999999999998 Q 166 152.79999999999998 178 159.79999999999998"
    stroke="#180e06" stroke-width="1.7" fill="none" stroke-linecap="round"/>

  <!-- ── Eyes ── -->
  <ellipse cx="134" cy="167.2" rx="7.5" ry="5.5" fill="white"/>
  <ellipse cx="166" cy="167.2" rx="7.5" ry="5.5" fill="white"/>
  <!-- Iris -->
  <circle cx="134" cy="167.2" r="4.2" fill="#2c1810"/>
  <circle cx="166" cy="167.2" r="4.2" fill="#2c1810"/>
  <!-- Pupil -->
  <circle cx="134" cy="167.2" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <circle cx="166" cy="167.2" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <!-- Highlight -->
  <circle cx="135.5" cy="165.7" r="1.3" fill="rgba(255,255,255,0.92)"/>
  <circle cx="167.5" cy="165.7" r="1.3" fill="rgba(255,255,255,0.92)"/>
  <line x1="127" y1="163.2" x2="125" y2="159.2" stroke="#180e06" stroke-width="1.2"/>
       <line x1="131" y1="161.7" x2="130" y2="157.7" stroke="#180e06" stroke-width="1.2"/>
       <line x1="136" y1="161.7" x2="136" y2="157.7" stroke="#180e06" stroke-width="1.2"/>
       <line x1="164" y1="161.7" x2="164" y2="157.7" stroke="#180e06" stroke-width="1.2"/>
       <line x1="169" y1="161.7" x2="170" y2="157.7" stroke="#180e06" stroke-width="1.2"/>
       <line x1="173" y1="163.2" x2="175" y2="159.2" stroke="#180e06" stroke-width="1.2"/>

  <!-- ── Nose ── -->
  <path d="M 146 181.24 L 143 196.84 Q 150 199.96 157 196.84 L 154 181.24"
    stroke="rgba(0,0,0,0.10)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="143.5" cy="197.36" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>
  <ellipse cx="156.5" cy="197.36" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>

  <!-- ── Mouth / Beard / Stubble ── -->
  <path d="M 139 203.6 Q 150 211.6 161 203.6" stroke="#d4607a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
       <path d="M 142 203.6 Q 150 207.6 158 203.6" fill="rgba(212,96,122,0.18)"/>
  
  

  <!-- ── Bottom name bar ── -->
  <rect x="0" y="281.2" width="300" height="98.8" fill="url(#namebar-nancy-ajram)"/>

  <text x="150" y="346"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="16" font-weight="900"
    fill="rgba(255,255,255,0.97)" letter-spacing="0.3">Nancy Ajram</text>

  <text x="150" y="366"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11" font-weight="400"
    fill="rgba(255,255,255,0.68)" letter-spacing="0.5">Music · Lebanon</text>
</svg>