<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <defs>
    <linearGradient id="bg-salah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c62a47"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="floor-salah" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a1020"/>
      <stop offset="100%" stop-color="#8a1020" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="namebar-salah" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.82)"/>
    </linearGradient>
    <radialGradient id="spotlight-salah" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Background gradient fills full frame – no clip -->
  <rect width="300" height="380" fill="url(#bg-salah)"/>
  <rect width="300" height="380" fill="url(#spotlight-salah)"/>

  <!-- Floor / lower darker band -->
  <rect x="0" y="273.59999999999997" width="300" height="106.4" fill="url(#floor-salah)"/>

  <!-- Subtle decorative orbs -->
  <circle cx="30"  cy="30"  r="80"  fill="rgba(255,255,255,0.05)"/>
  <circle cx="280" cy="360" r="90" fill="rgba(0,0,0,0.07)"/>

  <!-- Clothes / shirt collar area -->
  <ellipse cx="150" cy="390" rx="110" ry="121.60000000000001" fill="#c62a47dd"/>
  <ellipse cx="150" cy="390" rx="90.19999999999999" ry="102.60000000000001" fill="#c62a47ff"/>

  <!-- Neck -->
  <rect x="125.8" y="221" width="48.400000000000006" height="40" rx="16.94" fill="#b5743a"/>

  <!-- ── Hair behind head ── -->
  
        <ellipse cx="150" cy="109" rx="54" ry="29.700000000000003" fill="#0a0800"/>
        <ellipse cx="100" cy="127" rx="10" ry="18" fill="#0a0800"/>
        <ellipse cx="200" cy="127" rx="10" ry="18" fill="#0a0800"/>
      

  <!-- ── Head ── -->
  <ellipse cx="150" cy="175" rx="46" ry="54" fill="#b5743a"/>

  <!-- Ears -->
  <ellipse cx="103" cy="178.24" rx="7" ry="9" fill="#b5743a"/>
  <ellipse cx="197" cy="178.24" rx="7" ry="9" fill="#b5743a"/>
  <ellipse cx="103" cy="178.24" rx="3.5" ry="5" fill="#b5743a" opacity="0.7"/>
  <ellipse cx="197" cy="178.24" rx="3.5" ry="5" fill="#b5743a" opacity="0.7"/>

  <!-- ── Eyebrows ── -->
  <path d="M 118 159.1 Q 132 152.1 144 157.1"
    stroke="#0a0800" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 156 157.1 Q 168 152.1 182 159.1"
    stroke="#0a0800" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- ── Eyes ── -->
  <ellipse cx="132" cy="166.9" rx="7.5" ry="5.5" fill="white"/>
  <ellipse cx="168" cy="166.9" rx="7.5" ry="5.5" fill="white"/>
  <!-- Iris -->
  <circle cx="132" cy="166.9" r="4.2" fill="#2c1810"/>
  <circle cx="168" cy="166.9" r="4.2" fill="#2c1810"/>
  <!-- Pupil -->
  <circle cx="132" cy="166.9" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <circle cx="168" cy="166.9" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <!-- Highlight -->
  <circle cx="133.5" cy="165.4" r="1.3" fill="rgba(255,255,255,0.92)"/>
  <circle cx="169.5" cy="165.4" r="1.3" fill="rgba(255,255,255,0.92)"/>
  

  <!-- ── Nose ── -->
  <path d="M 146 181.48 L 143 197.68 Q 150 200.92 157 197.68 L 154 181.48"
    stroke="rgba(0,0,0,0.10)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="143.5" cy="198.22" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>
  <ellipse cx="156.5" cy="198.22" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>

  <!-- ── Mouth / Beard / Stubble ── -->
  <path d="M 137 204.7 Q 150 213.7 163 204.7" stroke="rgba(0,0,0,0.22)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="150" cy="207.4" rx="31.68" ry="15.120000000000001" fill="#0a0800" opacity="0.62"/>
       <ellipse cx="150" cy="197.68" rx="25.52" ry="9.719999999999999" fill="#0a0800" opacity="0.45"/>
  

  <!-- ── Bottom name bar ── -->
  <rect x="0" y="281.2" width="300" height="98.8" fill="url(#namebar-salah)"/>

  <text x="150" y="346"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="16" font-weight="900"
    fill="rgba(255,255,255,0.97)" letter-spacing="0.3">Mohamed Salah</text>

  <text x="150" y="366"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11" font-weight="400"
    fill="rgba(255,255,255,0.68)" letter-spacing="0.5">Football · Egypt</text>
</svg>