<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <defs>
    <linearGradient id="bg-cr7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#0e9f6e"/>
    </linearGradient>
    <linearGradient id="floor-cr7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a3a8a"/>
      <stop offset="100%" stop-color="#0a3a8a" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="namebar-cr7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.82)"/>
    </linearGradient>
    <radialGradient id="spotlight-cr7" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Background gradient fills full frame – no clip -->
  <rect width="300" height="380" fill="url(#bg-cr7)"/>
  <rect width="300" height="380" fill="url(#spotlight-cr7)"/>

  <!-- Floor / lower darker band -->
  <rect x="0" y="273.59999999999997" width="300" height="106.4" fill="url(#floor-cr7)"/>

  <!-- Subtle decorative orbs -->
  <circle cx="30"  cy="30"  r="80"  fill="rgba(255,255,255,0.05)"/>
  <circle cx="280" cy="360" r="90" fill="rgba(0,0,0,0.07)"/>

  <!-- Clothes / shirt collar area -->
  <ellipse cx="150" cy="390" rx="110" ry="121.60000000000001" fill="#1a56dbdd"/>
  <ellipse cx="150" cy="390" rx="90.19999999999999" ry="102.60000000000001" fill="#1a56dbff"/>

  <!-- Neck -->
  <rect x="124.7" y="223" width="50.6" height="40" rx="17.71" fill="#c8956c"/>

  <!-- ── Hair behind head ── -->
  
        <ellipse cx="150" cy="109" rx="52" ry="25.2" fill="#100800"/>
        <rect x="100" y="109" width="100" height="19.599999999999998" fill="#100800"/>
      

  <!-- ── Head ── -->
  <ellipse cx="150" cy="175" rx="48" ry="56" fill="#c8956c"/>

  <!-- Ears -->
  <ellipse cx="101" cy="178.36" rx="7" ry="9" fill="#c8956c"/>
  <ellipse cx="199" cy="178.36" rx="7" ry="9" fill="#c8956c"/>
  <ellipse cx="101" cy="178.36" rx="3.5" ry="5" fill="#c8956c" opacity="0.7"/>
  <ellipse cx="199" cy="178.36" rx="3.5" ry="5" fill="#c8956c" opacity="0.7"/>

  <!-- ── Eyebrows ── -->
  <path d="M 118 158.4 Q 132 151.4 144 156.4"
    stroke="#100800" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 156 156.4 Q 168 151.4 182 158.4"
    stroke="#100800" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- ── Eyes ── -->
  <ellipse cx="132" cy="166.6" rx="7.5" ry="5.5" fill="white"/>
  <ellipse cx="168" cy="166.6" rx="7.5" ry="5.5" fill="white"/>
  <!-- Iris -->
  <circle cx="132" cy="166.6" r="4.2" fill="#2c1810"/>
  <circle cx="168" cy="166.6" r="4.2" fill="#2c1810"/>
  <!-- Pupil -->
  <circle cx="132" cy="166.6" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <circle cx="168" cy="166.6" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <!-- Highlight -->
  <circle cx="133.5" cy="165.1" r="1.3" fill="rgba(255,255,255,0.92)"/>
  <circle cx="169.5" cy="165.1" r="1.3" fill="rgba(255,255,255,0.92)"/>
  

  <!-- ── Nose ── -->
  <path d="M 146 181.72 L 143 198.52 Q 150 201.88 157 198.52 L 154 181.72"
    stroke="rgba(0,0,0,0.10)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="143.5" cy="199.07999999999998" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>
  <ellipse cx="156.5" cy="199.07999999999998" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>

  <!-- ── Mouth / Beard / Stubble ── -->
  <path d="M 137 205.8 Q 150 214.8 163 205.8" stroke="rgba(0,0,0,0.22)" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  

  <!-- ── Bottom name bar ── -->
  <rect x="0" y="281.2" width="300" height="98.8" fill="url(#namebar-cr7)"/>

  <text x="150" y="346"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="16" font-weight="900"
    fill="rgba(255,255,255,0.97)" letter-spacing="0.3">Cristiano Ronaldo</text>

  <text x="150" y="366"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11" font-weight="400"
    fill="rgba(255,255,255,0.68)" letter-spacing="0.5">Football · Portugal</text>
</svg>