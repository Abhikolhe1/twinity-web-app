<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <defs>
    <linearGradient id="bg-elon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="floor-elon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="namebar-elon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.82)"/>
    </linearGradient>
    <radialGradient id="spotlight-elon" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Background gradient fills full frame – no clip -->
  <rect width="300" height="380" fill="url(#bg-elon)"/>
  <rect width="300" height="380" fill="url(#spotlight-elon)"/>

  <!-- Floor / lower darker band -->
  <rect x="0" y="273.59999999999997" width="300" height="106.4" fill="url(#floor-elon)"/>

  <!-- Subtle decorative orbs -->
  <circle cx="30"  cy="30"  r="80"  fill="rgba(255,255,255,0.05)"/>
  <circle cx="280" cy="360" r="90" fill="rgba(0,0,0,0.07)"/>

  <!-- Clothes / shirt collar area -->
  <ellipse cx="150" cy="390" rx="110" ry="121.60000000000001" fill="#374151dd"/>
  <ellipse cx="150" cy="390" rx="90.19999999999999" ry="102.60000000000001" fill="#374151ff"/>

  <!-- Neck -->
  <rect x="124.7" y="223" width="50.6" height="40" rx="17.71" fill="#f0c8a0"/>

  <!-- ── Hair behind head ── -->
  
        <ellipse cx="120.6" cy="115" rx="20" ry="17.92" fill="#555555" opacity="0.8"/>
        <ellipse cx="179.4" cy="115" rx="20" ry="17.92" fill="#555555" opacity="0.8"/>
        <ellipse cx="150" cy="117" rx="39" ry="12.32" fill="#555555" opacity="0.5"/>
      

  <!-- ── Head ── -->
  <ellipse cx="150" cy="175" rx="49" ry="56" fill="#f0c8a0"/>

  <!-- Ears -->
  <ellipse cx="100" cy="178.36" rx="7" ry="9" fill="#f0c8a0"/>
  <ellipse cx="200" cy="178.36" rx="7" ry="9" fill="#f0c8a0"/>
  <ellipse cx="100" cy="178.36" rx="3.5" ry="5" fill="#f0c8a0" opacity="0.7"/>
  <ellipse cx="200" cy="178.36" rx="3.5" ry="5" fill="#f0c8a0" opacity="0.7"/>

  <!-- ── Eyebrows ── -->
  <path d="M 118 158.4 Q 132 151.4 144 156.4"
    stroke="#555555" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 156 156.4 Q 168 151.4 182 158.4"
    stroke="#555555" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- ── Eyes ── -->
  <ellipse cx="132" cy="166.6" rx="7.5" ry="5.5" fill="white"/>
  <ellipse cx="168" cy="166.6" rx="7.5" ry="5.5" fill="white"/>
  <!-- Iris -->
  <circle cx="132" cy="166.6" r="4.2" fill="#7c5c30"/>
  <circle cx="168" cy="166.6" r="4.2" fill="#7c5c30"/>
  <!-- Pupil -->
  <circle cx="132" cy="166.6" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <circle cx="168" cy="166.6" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <!-- Highlight -->
  <circle cx="133.5" cy="165.1" r="1.3" fill="rgba(255,255,255,0.92)"/>
  <circle cx="169.5" cy="165.1" r="1.3" fill="rgba(255,255,255,0.92)"/>
  

  <!-- ── Nose ── -->
  <path d="M 146 181.72 L 143 198.52 Q 150 201.88 157 198.52 L 154 181.72"
    stroke="rgba(0,0,0,0.10)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="143.5" cy="199.07999999999998" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>
  <ellipse cx="156.5" cy="199.07999999999998" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>

  <!-- ── Mouth / Beard / Stubble ── -->
  <path d="M 137 205.8 Q 150 214.8 163 205.8" stroke="rgba(0,0,0,0.22)" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  

  <!-- ── Bottom name bar ── -->
  <rect x="0" y="281.2" width="300" height="98.8" fill="url(#namebar-elon)"/>

  <text x="150" y="346"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="16" font-weight="900"
    fill="rgba(255,255,255,0.97)" letter-spacing="0.3">Elon Musk</text>

  <text x="150" y="366"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11" font-weight="400"
    fill="rgba(255,255,255,0.68)" letter-spacing="0.5">Business · USA</text>
</svg>