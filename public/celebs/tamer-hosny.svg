<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <defs>
    <linearGradient id="bg-tamer-hosny" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="floor-tamer-hosny" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="namebar-tamer-hosny" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.82)"/>
    </linearGradient>
    <radialGradient id="spotlight-tamer-hosny" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Background gradient fills full frame – no clip -->
  <rect width="300" height="380" fill="url(#bg-tamer-hosny)"/>
  <rect width="300" height="380" fill="url(#spotlight-tamer-hosny)"/>

  <!-- Floor / lower darker band -->
  <rect x="0" y="273.59999999999997" width="300" height="106.4" fill="url(#floor-tamer-hosny)"/>

  <!-- Subtle decorative orbs -->
  <circle cx="30"  cy="30"  r="80"  fill="rgba(255,255,255,0.05)"/>
  <circle cx="280" cy="360" r="90" fill="rgba(0,0,0,0.07)"/>

  <!-- Clothes / shirt collar area -->
  <ellipse cx="150" cy="390" rx="110" ry="121.60000000000001" fill="#f97316dd"/>
  <ellipse cx="150" cy="390" rx="90.19999999999999" ry="102.60000000000001" fill="#f97316ff"/>

  <!-- Neck -->
  <rect x="126.9" y="220" width="46.2" height="40" rx="16.17" fill="#c8956c"/>

  <!-- ── Hair behind head ── -->
  
        <ellipse cx="150" cy="112" rx="48" ry="24.380000000000003" fill="#100800"/>
        <path d="M 130 110 Q 150 94 172 108" fill="#100800" stroke="none"/>
      

  <!-- ── Head ── -->
  <ellipse cx="150" cy="175" rx="45" ry="53" fill="#c8956c"/>

  <!-- Ears -->
  <ellipse cx="104" cy="178.18" rx="7" ry="9" fill="#c8956c"/>
  <ellipse cx="196" cy="178.18" rx="7" ry="9" fill="#c8956c"/>
  <ellipse cx="104" cy="178.18" rx="3.5" ry="5" fill="#c8956c" opacity="0.7"/>
  <ellipse cx="196" cy="178.18" rx="3.5" ry="5" fill="#c8956c" opacity="0.7"/>

  <!-- ── Eyebrows ── -->
  <path d="M 118 159.45000000000002 Q 132 152.45000000000002 144 157.45000000000002"
    stroke="#100800" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 156 157.45000000000002 Q 168 152.45000000000002 182 159.45000000000002"
    stroke="#100800" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- ── Eyes ── -->
  <ellipse cx="132" cy="167.05" rx="7.5" ry="5.5" fill="white"/>
  <ellipse cx="168" cy="167.05" rx="7.5" ry="5.5" fill="white"/>
  <!-- Iris -->
  <circle cx="132" cy="167.05" r="4.2" fill="#2c1810"/>
  <circle cx="168" cy="167.05" r="4.2" fill="#2c1810"/>
  <!-- Pupil -->
  <circle cx="132" cy="167.05" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <circle cx="168" cy="167.05" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <!-- Highlight -->
  <circle cx="133.5" cy="165.55" r="1.3" fill="rgba(255,255,255,0.92)"/>
  <circle cx="169.5" cy="165.55" r="1.3" fill="rgba(255,255,255,0.92)"/>
  

  <!-- ── Nose ── -->
  <path d="M 146 181.36 L 143 197.26 Q 150 200.44 157 197.26 L 154 181.36"
    stroke="rgba(0,0,0,0.10)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="143.5" cy="197.79" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>
  <ellipse cx="156.5" cy="197.79" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>

  <!-- ── Mouth / Beard / Stubble ── -->
  <path d="M 137 204.15 Q 150 213.15 163 204.15" stroke="rgba(0,0,0,0.22)" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  

  <!-- ── Bottom name bar ── -->
  <rect x="0" y="281.2" width="300" height="98.8" fill="url(#namebar-tamer-hosny)"/>

  <text x="150" y="346"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="16" font-weight="900"
    fill="rgba(255,255,255,0.97)" letter-spacing="0.3">Tamer Hosny</text>

  <text x="150" y="366"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11" font-weight="400"
    fill="rgba(255,255,255,0.68)" letter-spacing="0.5">Music · Egypt</text>
</svg>