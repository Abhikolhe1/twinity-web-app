<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <defs>
    <linearGradient id="bg-amr-diab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="floor-amr-diab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#92400e" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="namebar-amr-diab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.82)"/>
    </linearGradient>
    <radialGradient id="spotlight-amr-diab" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Background gradient fills full frame – no clip -->
  <rect width="300" height="380" fill="url(#bg-amr-diab)"/>
  <rect width="300" height="380" fill="url(#spotlight-amr-diab)"/>

  <!-- Floor / lower darker band -->
  <rect x="0" y="273.59999999999997" width="300" height="106.4" fill="url(#floor-amr-diab)"/>

  <!-- Subtle decorative orbs -->
  <circle cx="30"  cy="30"  r="80"  fill="rgba(255,255,255,0.05)"/>
  <circle cx="280" cy="360" r="90" fill="rgba(0,0,0,0.07)"/>

  <!-- Clothes / shirt collar area -->
  <ellipse cx="150" cy="390" rx="110" ry="121.60000000000001" fill="#f59e0bdd"/>
  <ellipse cx="150" cy="390" rx="90.19999999999999" ry="102.60000000000001" fill="#f59e0bff"/>

  <!-- Neck -->
  <rect x="126.35" y="222" width="47.300000000000004" height="40" rx="16.555" fill="#c8956c"/>

  <!-- ── Hair behind head ── -->
  
        <ellipse cx="150" cy="112" rx="52" ry="26.4" fill="#1e1008"/>
        <ellipse cx="106" cy="130" rx="11" ry="22" fill="#1e1008"/>
        <ellipse cx="194" cy="130" rx="11" ry="22" fill="#1e1008"/>
      

  <!-- ── Head ── -->
  <ellipse cx="150" cy="175" rx="46" ry="55" fill="#c8956c"/>

  <!-- Ears -->
  <ellipse cx="103" cy="178.3" rx="7" ry="9" fill="#c8956c"/>
  <ellipse cx="197" cy="178.3" rx="7" ry="9" fill="#c8956c"/>
  <ellipse cx="103" cy="178.3" rx="3.5" ry="5" fill="#c8956c" opacity="0.7"/>
  <ellipse cx="197" cy="178.3" rx="3.5" ry="5" fill="#c8956c" opacity="0.7"/>

  <!-- ── Eyebrows ── -->
  <path d="M 118 158.75 Q 132 151.75 144 156.75"
    stroke="#1e1008" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 156 156.75 Q 168 151.75 182 158.75"
    stroke="#1e1008" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- ── Eyes ── -->
  <ellipse cx="132" cy="166.75" rx="7.5" ry="5.5" fill="white"/>
  <ellipse cx="168" cy="166.75" rx="7.5" ry="5.5" fill="white"/>
  <!-- Iris -->
  <circle cx="132" cy="166.75" r="4.2" fill="#2c1810"/>
  <circle cx="168" cy="166.75" r="4.2" fill="#2c1810"/>
  <!-- Pupil -->
  <circle cx="132" cy="166.75" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <circle cx="168" cy="166.75" r="2.6" fill="rgba(0,0,0,0.88)"/>
  <!-- Highlight -->
  <circle cx="133.5" cy="165.25" r="1.3" fill="rgba(255,255,255,0.92)"/>
  <circle cx="169.5" cy="165.25" r="1.3" fill="rgba(255,255,255,0.92)"/>
  

  <!-- ── Nose ── -->
  <path d="M 146 181.6 L 143 198.1 Q 150 201.4 157 198.1 L 154 181.6"
    stroke="rgba(0,0,0,0.10)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="143.5" cy="198.65" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>
  <ellipse cx="156.5" cy="198.65" rx="4" ry="2.5" fill="rgba(0,0,0,0.07)"/>

  <!-- ── Mouth / Beard / Stubble ── -->
  <path d="M 137 205.25 Q 150 214.25 163 205.25" stroke="rgba(0,0,0,0.22)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="150" cy="208" rx="30.959999999999997" ry="15.400000000000002" fill="#1e1008" opacity="0.62"/>
       <ellipse cx="150" cy="198.1" rx="24.939999999999998" ry="9.9" fill="#1e1008" opacity="0.45"/>
  

  <!-- ── Bottom name bar ── -->
  <rect x="0" y="281.2" width="300" height="98.8" fill="url(#namebar-amr-diab)"/>

  <text x="150" y="346"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="16" font-weight="900"
    fill="rgba(255,255,255,0.97)" letter-spacing="0.3">Amr Diab</text>

  <text x="150" y="366"
    text-anchor="middle" dominant-baseline="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11" font-weight="400"
    fill="rgba(255,255,255,0.68)" letter-spacing="0.5">Music · Egypt</text>
</svg>